name: Build and verify Notebook Tools
on:
  push:
    branches: [feature/notebook-export-v05]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node tests/browser-smoke.mjs
      - name: Commit verified static runtime to development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/notebook-export-v05'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f src/vendor package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified local PDF runtime and UD font assets'
            git push
          fi
